%% The platform (core) commands edges and reads their telemetry and replies.
{allow, {username, "platform"}, publish, ["control/#", "responsibility.transferred/#"]}.
{allow, {username, "platform"}, subscribe, ["telemetry/#", "response/#"]}.
%% An edge's username is "<tenant>/<controller>": it reads only its own commands
%% and writes only its own telemetry and its own replies (response/<tenant>/<controller>/<id>),
%% so no edge can answer a request sent to another (Compass d36667d9).
{allow, all, subscribe, ["control/${username}/#"]}.
{allow, all, publish, ["telemetry/${username}/#", "response/${username}/#"]}.
{deny, all}.
