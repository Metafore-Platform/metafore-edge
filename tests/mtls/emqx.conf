node {
  name = "emqx@127.0.0.1"
  cookie = "emqx-dev-cookie"
  data_dir = "data"
}
cluster {
  name = emqxcl
  discovery_strategy = manual
}
dashboard {
  listeners.http.bind = 18083
}
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm { name = sha256, salt_position = suffix }
    bootstrap_file = "/opt/emqx/etc/auth/users.csv"
    bootstrap_type = plain
  }
]
authorization {
  no_match = deny
  deny_action = ignore
  cache { enable = false }
  sources = [
    { type = file, enable = true, path = "/opt/emqx/etc/acl/acl.conf" }
  ]
}
