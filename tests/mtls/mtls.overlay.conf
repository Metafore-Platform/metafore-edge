
# ── appended to the pinned emqx.conf by scripts/mtls-broker.sh ─────────────────────────────────────────────────────────
# Hand-kept copy of the chart's certificate listener (metafore-api deploy/helm/metafore/templates/emqx.yaml, the `$mtls`
# block, and the `api_key` block): only a client certificate from the CA completes the handshake (verify_peer +
# fail_if_no_peer_cert); its common name becomes the username (zone mtls, this listener only), which the topic rules in
# acl.conf key on. No password check there: the verified certificate is the sign-in. If the chart's block changes, change
# this and re-pin with scripts/sync-broker-config.sh.
api_key {
  bootstrap_file = "/opt/emqx/etc/api-key/api_keys.txt"
}
zones.mtls {
  mqtt { peer_cert_as_username = cn }
}
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  zone = mtls
  enable_authn = false
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/mqtt/ca.crt"
    certfile = "/opt/emqx/etc/certs/mqtt/tls.crt"
    keyfile = "/opt/emqx/etc/certs/mqtt/tls.key"
    verify = verify_peer
    fail_if_no_peer_cert = true
    versions = ["tlsv1.3", "tlsv1.2"]
  }
}
