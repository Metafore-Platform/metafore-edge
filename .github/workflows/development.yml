name: development

# The v2 branch. It builds and tests; it does not publish or roll out anything. main, staging and eng/** have their own
# workflows (ci.yml, eng-branch-deploy.yml) and none of them fires for this branch; the first job below fails the build if
# that stops being true. Read-only token, no secrets, no cloud login.
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: No workflow that can run for development may deploy
        run: python scripts/check_no_deploy_on_development.py
      - name: The guard's own tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and run the unit and contract tests
        run: mvn package -B
