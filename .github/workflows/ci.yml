        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        # Always push the SHA tag. Push :latest ONLY on main — prod's edge deploy
        # is a `rollout restart` that re-pulls :latest, so a staging build must
        # never overwrite it.
        run: |
          docker build -t $ECR_REGISTRY/metafore-ilan/metafore-edge:${{ github.sha }} .
          docker push $ECR_REGISTRY/metafore-ilan/metafore-edge:${{ github.sha }}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag $ECR_REGISTRY/metafore-ilan/metafore-edge:${{ github.sha }} $ECR_REGISTRY/metafore-ilan/metafore-edge:latest
            docker push $ECR_REGISTRY/metafore-ilan/metafore-edge:latest
          fi
        env:
          ECR_REGISTRY: 359469026479.dkr.ecr.us-east-1.amazonaws.com

      # Phase 14.19 — AC Register Wizard fix. Mirror the edge image to a
      # public GHCR repo so customers with only Docker Desktop installed
      # can `docker pull` the image from the wizard snippet without
      # needing ECR credentials. ECR push above stays primary for the
      # cluster's own metafore-edge deployment; GHCR is the public
      # distribution channel referenced by METAFORE_EDGE_IMAGE.
      #
      # Auth uses the built-in GITHUB_TOKEN (no PAT to create) — see
      # the `packages: write` permission on this job. After the FIRST
      # successful push, the operator must visit the package page at
      # https://github.com/<owner>?tab=packages → metafore-edge →
      # Package settings → Change visibility → Public, otherwise the
      # wizard's `docker pull` from a customer laptop hits a 401.
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          # GHCR / Docker registry paths must be lowercase; the owner
          # slug `ilansehayekCA` is mixed-case so we downcase before
          # constructing the tag.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag $ECR_REGISTRY/metafore-ilan/metafore-edge:${{ github.sha }} \
            ghcr.io/$OWNER/metafore-edge:${{ github.sha }}
          docker tag $ECR_REGISTRY/metafore-ilan/metafore-edge:${{ github.sha }} \
            ghcr.io/$OWNER/metafore-edge:latest
          docker push ghcr.io/$OWNER/metafore-edge:${{ github.sha }}
          docker push ghcr.io/$OWNER/metafore-edge:latest
        env:
          ECR_REGISTRY: 359469026479.dkr.ecr.us-east-1.amazonaws.com

      # DEPLOY GATE (repo cutover, task c70c1265-a338-47f2-a631-fea4917e56d4): the rollout runs only
      # when the repository variable for this branch's environment is 'true' (DEPLOY_ENABLED_STAGING
      # for staging, DEPLOY_ENABLED_PRODUCTION for main). Neither exists yet, so the image is built and
      # pushed but nothing is rolled out. Same gate as metafore-core and metafore-ui; flip with
      #   gh variable set DEPLOY_ENABLED_<STAGING|PRODUCTION> --repo Metafore-Platform/metafore-edge --body true
      - name: Deploy to EKS
        if: (github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED_PRODUCTION == 'true') || (github.ref == 'refs/heads/staging' && vars.DEPLOY_ENABLED_STAGING == 'true')
        # staging: pin the edge deployment to the pushed SHA on the metafore-staging
        # cluster. main: unchanged — rollout restart re-pulls :latest on prod.
        run: |
          if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            aws eks update-kubeconfig --name metafore-staging --region us-east-1
            kubectl set image deployment/metafore-edge -n metafore edge=$ECR_REGISTRY/metafore-ilan/metafore-edge:${{ github.sha }}
            kubectl rollout status deployment/metafore-edge -n metafore --timeout=300s
          else
            aws eks update-kubeconfig --name metafore-ilan-project-dev --region us-east-1
            kubectl rollout restart deployment/metafore-edge -n metafore
          fi
        env:
          ECR_REGISTRY: 359469026479.dkr.ecr.us-east-1.amazonaws.com
