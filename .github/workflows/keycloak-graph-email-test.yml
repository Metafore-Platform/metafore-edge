name: keycloak-graph-email-test

on:
  pull_request:
    paths: ['keycloak-graph-email/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: keycloak-graph-email
        run: mvn package -B
