name: keycloak-graph-email

on:
  push:
    branches: [development]
    paths: ['keycloak-graph-email/**']
  pull_request:
    paths: ['keycloak-graph-email/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: keycloak-graph-email
        run: mvn package -B

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/development' && vars.EDGE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build jar
        working-directory: keycloak-graph-email
        run: mvn package -B -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.EDGE_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image and push to ECR
        id: push
        working-directory: keycloak-graph-email
        env:
          ECR_REGISTRY: 359469026479.dkr.ecr.us-east-1.amazonaws.com
        run: |
          IMAGE=$ECR_REGISTRY/metafore-dev/keycloak
          docker build -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:${{ github.sha }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE:${{ github.sha }} | cut -d@ -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Pushed $IMAGE:${{ github.sha }} digest=$DIGEST"
